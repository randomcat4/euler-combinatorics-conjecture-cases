name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/validate_repo.py
      - run: python -B cases/zhao-restricted-zero-sum-counterexample/check_counterexample.py
      - run: python -B cases/catalan-schett-plane-tree-statistic/check_small_cases.py
      - run: python -B cases/partition-matrix-bijection/verify_bijection.py
